        const Indicators = {
            calcEMA: (candles, period) => {
                if (!candles || candles.length < period) return Array(candles ? candles.length : 0).fill(null);
                const k = 2 / (period + 1);
                const ema = [];
                let sum = 0;
                for (let i = 0; i < period; i++) {
                    sum += candles[i].close;
                    ema.push(null);
                }
                let prevEma = sum / period;
                ema[period - 1] = prevEma;

                for (let i = period; i < candles.length; i++) {
                    const currentEma = (candles[i].close * k) + (prevEma * (1 - k));
                    ema.push(currentEma);
                    prevEma = currentEma;
                }
                return ema;
            },
            calcSMA: (data, period) => {
                if (!data || data.length < period) return Array(data ? data.length : 0).fill(null);
                const sma = [];
                for (let i = 0; i < data.length; i++) {
                    if (i < period - 1) {
                        sma.push(null);
                    } else {
                        let sum = 0;
                        for (let j = 0; j < period; j++) {
                            sum += (typeof data[i - j] === 'number' ? data[i - j] : data[i - j].volume);
                        }
                        sma.push(sum / period);
                    }
                }
                return sma;
            },
            calcVWAP: (candles) => {
                if (!candles || candles.length === 0) return [];
                let cumVol = 0;
                let cumTPV = 0;
                return candles.map(c => {
                    const tp = (c.high + c.low + c.close) / 3;
                    cumVol += c.volume;
                    cumTPV += tp * c.volume;
                    return cumVol > 0 ? cumTPV / cumVol : c.close;
                });
            },
            calcRSI: (candles, period = 14) => {
                if (!candles || candles.length <= period) return Array(candles ? candles.length : 0).fill(null);
                const rsi = Array(candles.length).fill(null);
                let gains = 0;
                let losses = 0;

                for (let i = 1; i <= period; i++) {
                    const change = candles[i].close - candles[i - 1].close;
                    if (change >= 0) gains += change;
                    else losses += Math.abs(change);
                }

                let avgGain = gains / period;
                let avgLoss = losses / period;
                rsi[period] = 100 - (100 / (1 + (avgGain / (avgLoss || 1))));

                for (let i = period + 1; i < candles.length; i++) {
                    const change = candles[i].close - candles[i - 1].close;
                    const gain = change >= 0 ? change : 0;
                    const loss = change < 0 ? Math.abs(change) : 0;

                    avgGain = ((avgGain * (period - 1)) + gain) / period;
                    avgLoss = ((avgLoss * (period - 1)) + loss) / period;

                    const rs = avgGain / (avgLoss || 0.00001);
                    rsi[i] = 100 - (100 / (1 + rs));
                }
                return rsi;
            },
            calcMACD: (candles, fast = 12, slow = 26, signal = 9) => {
                const emaFast = Indicators.calcEMA(candles, fast);
                const emaSlow = Indicators.calcEMA(candles, slow);
                const macdLine = Array(candles.length).fill(null);
                const dummyCandles = [];

                for (let i = 0; i < candles.length; i++) {
                    if (emaFast[i] !== null && emaSlow[i] !== null) {
                        macdLine[i] = emaFast[i] - emaSlow[i];
                        dummyCandles.push({ close: macdLine[i] });
                    } else {
                        dummyCandles.push({ close: 0 });
                    }
                }

                const signalLine = Indicators.calcEMA(dummyCandles, signal);
                const histogram = Array(candles.length).fill(null);

                for (let i = 0; i < candles.length; i++) {
                    if (macdLine[i] !== null && signalLine[i] !== null) {
                        histogram[i] = macdLine[i] - signalLine[i];
                    }
                }
                return { macd: macdLine, signal: signalLine, histogram };
            },
            calcATR: (candles, period = 14) => {
                if (!candles || candles.length <= period) return Array(candles ? candles.length : 0).fill(null);
                const tr = [candles[0].high - candles[0].low];
                for (let i = 1; i < candles.length; i++) {
                    const h = candles[i].high;
                    const l = candles[i].low;
                    const prevC = candles[i - 1].close;
                    tr.push(Math.max(h - l, Math.abs(h - prevC), Math.abs(l - prevC)));
                }
                const atr = Array(candles.length).fill(null);
                let sum = 0;
                for (let i = 0; i < period; i++) sum += tr[i];
                atr[period - 1] = sum / period;

                for (let i = period; i < candles.length; i++) {
                    atr[i] = ((atr[i - 1] * (period - 1)) + tr[i]) / period;
                }
                return atr;
            },
            calcDonchian: (candles, period = 20) => {
                if (!candles || candles.length < period) return { upper: [], lower: [], middle: [] };
                const upper = [];
                const lower = [];
                const middle = [];

                for (let i = 0; i < candles.length; i++) {
                    if (i < period) {
                        upper.push(null);
                        lower.push(null);
                        middle.push(null);
                    } else {
                        let maxHigh = -Infinity;
                        let minLow = Infinity;
                        for (let j = 1; j <= period; j++) {
                            const c = candles[i - j];
                            if (c.high > maxHigh) maxHigh = c.high;
                            if (c.low < minLow) minLow = c.low;
                        }
                        upper.push(maxHigh);
                        lower.push(minLow);
                        middle.push((maxHigh + minLow) / 2);
                    }
                }
                return { upper, lower, middle };
            }
        };

        const TF_MS = { '1m':60000, '3m':180000, '5m':300000, '15m':900000, '30m':1800000, '1h':3600000, '2h':7200000, '4h':14400000, '6h':21600000, '8h':28800000, '12h':43200000, '1d':86400000, '3d':259200000, '1w':604800000, '1M':2592000000 };

        async function fetchJson(url, timeoutMs = 10000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
                if (!res.ok) throw new Error(`Binance HTTP ${res.status}`);
                return await res.json();
            } catch (e) {
                if (e.name === 'AbortError') throw new Error('หมดเวลารอข้อมูลจาก Binance / Binance request timed out');
                throw e;
            } finally { clearTimeout(timer); }
        }

        async function fetchBinanceKlines(symbol = 'BTCUSDT', interval = '1h', limit = 250) {
            // Futures only: never silently substitute spot data for futures analysis.
            const safeLimit = Math.min(500, Math.max(210, Number(limit) || 250));
            const data = await fetchJson(`https://fapi.binance.com/fapi/v1/klines?symbol=${encodeURIComponent(symbol)}&interval=${encodeURIComponent(interval)}&limit=${safeLimit}`);
            if (!Array.isArray(data) || data.length === 0) throw new Error('Binance ไม่ส่งข้อมูลแท่งเทียนกลับมา / No candle data returned');
            const now = Date.now();
            const duration = TF_MS[interval] || 3600000;
            const candles = data.map(d => ({
                time: Math.floor(Number(d[0]) / 1000), openTime: Number(d[0]), closeTime: Number(d[6]),
                open: Number(d[1]), high: Number(d[2]), low: Number(d[3]), close: Number(d[4]), volume: Number(d[5]),
                isClosed: Number(d[6]) < now
            })).filter(c => [c.open, c.high, c.low, c.close, c.volume].every(Number.isFinite) && c.close > 0 && c.high >= c.low);
            const closed = candles.filter(c => c.isClosed);
            if (closed.length < 200) throw new Error(`แท่งเทียนปิดแล้วมีเพียง ${closed.length} แท่ง ต้องมีอย่างน้อย 200 แท่งสำหรับ EMA 200 / Need 200 closed candles for EMA 200`);
            return closed;
        }

        async function fetchBinance24hTicker(symbol = 'BTCUSDT') {
            const data = await fetchJson(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${encodeURIComponent(symbol)}`);
            const values = ['lastPrice','priceChangePercent','highPrice','lowPrice','volume'];
            if (!data || values.some(k => !Number.isFinite(Number(data[k])))) throw new Error('ข้อมูล Ticker 24 ชั่วโมงไม่ถูกต้อง / Invalid 24h ticker payload');
            return { price: Number(data.lastPrice), change: Number(data.priceChangePercent), high: Number(data.highPrice), low: Number(data.lowPrice), volume: Number(data.volume) };
        }

        // Historical paper-trade evaluation for each timeframe. Uses CLOSED Binance USDⓈ-M candles only.
        // Entry = signal candle close; SL/TP follow the app's existing rolling-pivot rules; fixed 1,000 USDT notional;
        // estimated taker fee = 0.05% per side. Same-candle TP/SL ambiguity is conservatively counted as SL.
        function evaluateTimeframePerformance(candles, tf, takerFeePct = 0.05) {
            if (!Array.isArray(candles) || candles.length < 220) return { tf, status: 'INSUFFICIENT', sample: candles?.length || 0 };
            const ema20 = Indicators.calcEMA(candles, 20);
            const ema50 = Indicators.calcEMA(candles, 50);
            const ema200 = Indicators.calcEMA(candles, 200);
            const rsi = Indicators.calcRSI(candles, 14);
            // Keep the fee rate in function scope: it is also used in the summary returned below.
            const feeRate = Math.max(0, Number(takerFeePct) || 0) / 100;
            const trades = [];
            let previousSignal = 'WAIT';
            let i = 200;
            while (i < candles.length - 1) {
                const c = candles[i];
                let signal = 'WAIT';
                if ([ema20[i], ema50[i], ema200[i], rsi[i]].every(Number.isFinite)) {
                    if (c.close > ema20[i] && ema20[i] > ema50[i] && ema50[i] > ema200[i] && rsi[i] > 50) signal = 'LONG';
                    else if (c.close < ema20[i] && ema20[i] < ema50[i] && ema50[i] < ema200[i] && rsi[i] < 50) signal = 'SHORT';
                }
                const isNewSignal = signal !== 'WAIT' && signal !== previousSignal;
                previousSignal = signal;
                if (!isNewSignal) { i++; continue; }

                const entry = c.close;
                const direction = signal === 'LONG' ? 1 : -1;
                const windowCandles = candles.slice(Math.max(0, i - 249), i + 1);
                const rangeHigh = Math.max(...windowCandles.map(x => x.high));
                const rangeLow = Math.min(...windowCandles.map(x => x.low));
                const pivot = (rangeHigh + rangeLow + entry) / 3;
                const r1 = (2 * pivot) - rangeLow;
                const s1 = (2 * pivot) - rangeHigh;
                const sl = signal === 'LONG' ? Math.min(s1, entry * 0.995) : Math.max(r1, entry * 1.005);
                const tp = signal === 'LONG' ? Math.max(r1, entry * 1.005) : Math.min(s1, entry * 0.995);
                const notional = 1000;
                const qty = notional / entry;
                let exit = null, outcome = 'OPEN', exitIndex = candles.length - 1;
                for (let j = i + 1; j < candles.length; j++) {
                    const bar = candles[j];
                    const hitSL = direction === 1 ? bar.low <= sl : bar.high >= sl;
                    const hitTP = direction === 1 ? bar.high >= tp : bar.low <= tp;
                    if (hitSL && hitTP) { exit = sl; outcome = 'SL'; exitIndex = j; break; }
                    if (hitSL) { exit = sl; outcome = 'SL'; exitIndex = j; break; }
                    if (hitTP) { exit = tp; outcome = 'TP'; exitIndex = j; break; }
                }
                if (exit === null) exit = candles[candles.length - 1].close;
                const gross = direction * (exit - entry) * qty;
                const fees = notional * feeRate * (outcome === 'OPEN' ? 2 : 2);
                const net = gross - fees;
                trades.push({ signal, entry, exit, sl, tp, outcome, net, netPct: (net / notional) * 100, entryTime: c.openTime, exitTime: candles[exitIndex].closeTime });
                if (outcome === 'OPEN') break;
                i = exitIndex + 1;
            }
            const closed = trades.filter(t => t.outcome !== 'OPEN');
            const wins = closed.filter(t => t.outcome === 'TP').length;
            const losses = closed.filter(t => t.outcome === 'SL').length;
            const netClosed = closed.reduce((sum, t) => sum + t.net, 0);
            const openTrade = trades.find(t => t.outcome === 'OPEN') || null;
            return {
                tf, status: 'READY', sample: candles.length, trades: trades.length, wins, losses,
                winRate: closed.length ? (wins / closed.length) * 100 : null,
                netClosed, openTrade, totalNet: netClosed + (openTrade ? openTrade.net : 0),
                lastPrice: candles[candles.length - 1].close,
                lastSignal: (() => { const k = candles.length - 1; return ema20[k] && ema50[k] && ema200[k] && rsi[k] > 50 && candles[k].close > ema20[k] && ema20[k] > ema50[k] && ema50[k] > ema200[k] ? 'LONG' : ema20[k] && ema50[k] && ema200[k] && rsi[k] < 50 && candles[k].close < ema20[k] && ema20[k] < ema50[k] && ema50[k] < ema200[k] ? 'SHORT' : 'WAIT'; })(),
                feePct: feeRate * 100
            };
        }

        function TradingChart({ candles, theme, layerSettings, glowLevel, analysis }) {
            const chartContainerRef = useRef(null);
            const overlayCanvasRef = useRef(null);
            const chartRef = useRef(null);
            const seriesMapRef = useRef({});

            useEffect(() => {
                if (!chartContainerRef.current) return;
                if (typeof LightweightCharts === 'undefined') return;

                try {
                    const isDark = theme === 'dark';
                    const chart = LightweightCharts.createChart(chartContainerRef.current, {
                        layout: {
                            background: { color: isDark ? '#04060A' : '#FFFFFF' },
                            textColor: isDark ? '#94A3B8' : '#334155',
                        },
                        grid: {
                            vertLines: { color: isDark ? 'rgba(26, 35, 58, 0.4)' : '#E2E8F0' },
                            horzLines: { color: isDark ? 'rgba(26, 35, 58, 0.4)' : '#E2E8F0' },
                        },
                        crosshair: {
                            mode: LightweightCharts.CrosshairMode ? LightweightCharts.CrosshairMode.Normal : 0,
                        },
                        rightPriceScale: {
                            borderColor: isDark ? '#1A233A' : '#CBD5E1',
                        },
                        timeScale: {
                            borderColor: isDark ? '#1A233A' : '#CBD5E1',
                            timeVisible: true,
                            secondsVisible: false,
                        },
                    });

                    const candlestickSeries = chart.addCandlestickSeries({
                        upColor: '#00FF9C',
                        downColor: '#FF1744',
                        borderVisible: false,
                        wickUpColor: '#00FF9C',
                        wickDownColor: '#FF1744',
                    });

                    chartRef.current = chart;
                    seriesMapRef.current = { candlestick: candlestickSeries };

                    const handleResize = () => {
                        if (chartContainerRef.current && chartRef.current) {
                            const width = chartContainerRef.current.clientWidth;
                            const height = chartContainerRef.current.clientHeight;
                            try {
                                chartRef.current.applyOptions({ width, height });
                            } catch (e) {}
                            if (overlayCanvasRef.current) {
                                overlayCanvasRef.current.width = width;
                                overlayCanvasRef.current.height = height;
                            }
                        }
                    };

                    window.addEventListener('resize', handleResize);
                    handleResize();

                    return () => {
                        window.removeEventListener('resize', handleResize);
                        if (chartRef.current) {
                            try {
                                chartRef.current.remove();
                            } catch(e) {}
                            chartRef.current = null;
                            seriesMapRef.current = {};
                        }
                    };
                } catch (e) {
                    console.error("Error creating chart:", e);
                }
            }, [theme]);

            useEffect(() => {
                if (!chartRef.current || !candles || candles.length === 0 || !seriesMapRef.current.candlestick) return;

                const chart = chartRef.current;
                const formatted = candles.map(c => ({
                    time: c.time,
                    open: c.open,
                    high: c.high,
                    low: c.low,
                    close: c.close
                }));
                try {
                    seriesMapRef.current.candlestick.setData(formatted);
                } catch (e) {
                    return;
                }

                const syncLineSeries = (key, dataArray) => {
                    if (!chartRef.current) return;
                    const setting = layerSettings[key];
                    if (!setting || !setting.visible || !dataArray || dataArray.length === 0) {
                        if (seriesMapRef.current[key]) {
                            try {
                                chart.removeSeries(seriesMapRef.current[key]);
                            } catch (e) {}
                            delete seriesMapRef.current[key];
                        }
                        return;
                    }

                    try {
                        if (!seriesMapRef.current[key]) {
                            seriesMapRef.current[key] = chart.addLineSeries({
                                color: setting.color,
                                lineWidth: setting.width,
                                lineStyle: setting.style,
                                crosshairMarkerVisible: true,
                            });
                        } else {
                            seriesMapRef.current[key].applyOptions({
                                color: setting.color,
                                lineWidth: setting.width,
                                lineStyle: setting.style,
                            });
                        }

                        const seriesData = [];
                        for (let i = 0; i < candles.length; i++) {
                            if (dataArray[i] !== null && dataArray[i] !== undefined) {
                                seriesData.push({ time: candles[i].time, value: dataArray[i] });
                            }
                        }
                        seriesMapRef.current[key].setData(seriesData);
                    } catch (e) {
                        delete seriesMapRef.current[key];
                    }
                };

                const ema20 = Indicators.calcEMA(candles, 20);
                const ema50 = Indicators.calcEMA(candles, 50);
                const ema200 = Indicators.calcEMA(candles, 200);
                const vwap = Indicators.calcVWAP(candles);
                const donchian = Indicators.calcDonchian(candles, 20);

                syncLineSeries('ema20', ema20);
                syncLineSeries('ema50', ema50);
                syncLineSeries('ema200', ema200);
                syncLineSeries('vwap', vwap);
                syncLineSeries('donchianUpper', donchian.upper);
                syncLineSeries('donchianMiddle', donchian.middle);
                syncLineSeries('donchianLower', donchian.lower);

                if (analysis) {
                    const priceLines = [
                        { key: 'support', val: analysis.pivots ? analysis.pivots.s1 : null },
                        { key: 'resistance', val: analysis.pivots ? analysis.pivots.r1 : null },
                        { key: 'entryPlan', val: analysis.strat2 ? analysis.strat2.entry : null },
                        { key: 'slPlan', val: analysis.strat2 ? analysis.strat2.sl : null },
                        { key: 'tpPlan', val: analysis.strat2 ? analysis.strat2.tp : null },
                        { key: 'pdhl', val: analysis.pivots ? analysis.pivots.p : null },
                    ];

                    priceLines.forEach(({ key, val }) => {
                        if (val !== null) {
                            const lineData = candles.map(() => val);
                            syncLineSeries(key, lineData);
                        }
                    });
                }

                if (overlayCanvasRef.current && chartRef.current && seriesMapRef.current.candlestick) {
                    const canvas = overlayCanvasRef.current;
                    const ctx = canvas.getContext('2d');
                    const mainSeries = seriesMapRef.current.candlestick;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    if (analysis && candles.length > 5) {
                        try {
                            if (layerSettings.supplyZone && layerSettings.supplyZone.visible && analysis.pivots) {
                                const topY = mainSeries.priceToCoordinate(analysis.pivots.r2);
                                const bottomY = mainSeries.priceToCoordinate(analysis.pivots.r1);
                                if (topY !== null && bottomY !== null) {
                                    ctx.fillStyle = layerSettings.supplyZone.color;
                                    ctx.fillRect(0, Math.min(topY, bottomY), canvas.width, Math.abs(bottomY - topY));
                                }
                            }

                            if (layerSettings.demandZone && layerSettings.demandZone.visible && analysis.pivots) {
                                const topY = mainSeries.priceToCoordinate(analysis.pivots.s1);
                                const bottomY = mainSeries.priceToCoordinate(analysis.pivots.s2);
                                if (topY !== null && bottomY !== null) {
                                    ctx.fillStyle = layerSettings.demandZone.color;
                                    ctx.fillRect(0, Math.min(topY, bottomY), canvas.width, Math.abs(bottomY - topY));
                                }
                            }

                            ctx.font = 'bold 11px "JetBrains Mono", monospace';
                            if (layerSettings.bos && layerSettings.bos.visible && analysis.donUpper) {
                                const y = mainSeries.priceToCoordinate(analysis.donUpper);
                                if (y !== null) {
                                    ctx.fillStyle = layerSettings.bos.color;
                                    if (glowLevel !== 'off') {
                                        ctx.shadowColor = layerSettings.bos.color;
                                        ctx.shadowBlur = glowLevel === 'high' ? 12 : glowLevel === 'medium' ? 6 : 2;
                                    }
                                    ctx.fillText("⚡ BOS (Bullish Breakout)", 20, y - 6);
                                    ctx.shadowBlur = 0;
                                }
                            }

                            if (layerSettings.choch && layerSettings.choch.visible && analysis.donLower) {
                                const y = mainSeries.priceToCoordinate(analysis.donLower);
                                if (y !== null) {
                                    ctx.fillStyle = layerSettings.choch.color;
                                    if (glowLevel !== 'off') {
                                        ctx.shadowColor = layerSettings.choch.color;
                                        ctx.shadowBlur = glowLevel === 'high' ? 12 : glowLevel === 'medium' ? 6 : 2;
                                    }
                                    ctx.fillText("🔥 CHoCH (Bearish Shift)", 20, y + 15);
                                    ctx.shadowBlur = 0;
                                }
                            }
                        } catch (e) {}
                    }
                }

            }, [candles, layerSettings, analysis, glowLevel]);

            return (
                <div className="relative w-full h-full min-h-[380px]">
                    <div ref={chartContainerRef} className="w-full h-full" />
                    <canvas
                        ref={overlayCanvasRef}
                        className="absolute inset-0 pointer-events-none z-10"
                    />
                </div>
            );
        }

                    } else if (type === 'MACD') {

                        const signalSeries = chart.addLineSeries({ color: '#FF4FD8', lineWidth: 2 });

                                });

            /* Calculation & Technical Analysis Engine */
            const analysis = useMemo(() => {
                if (!candles || candles.length < 200) return null;
                const last = candles[candles.length - 1];
                const ema20 = Indicators.calcEMA(candles, 20).slice(-1)[0];
                const ema50 = Indicators.calcEMA(candles, 50).slice(-1)[0];
                const ema200 = Indicators.calcEMA(candles, 200).slice(-1)[0];
                const rsi = Indicators.calcRSI(candles, 14).slice(-1)[0];
                const donchian = Indicators.calcDonchian(candles, 20);

                const donUpper = donchian.upper.slice(-1)[0];
                const donLower = donchian.lower.slice(-1)[0];

                let signal = 'WAIT';
                if ([ema20, ema50, ema200, rsi].every(Number.isFinite)) {
                    if (last.close > ema20 && ema20 > ema50 && ema50 > ema200 && rsi > 50) signal = 'LONG';
                    else if (last.close < ema20 && ema20 < ema50 && ema50 < ema200 && rsi < 50) signal = 'SHORT';
                }

                const high = Math.max(...candles.map(c => c.high));
                const low = Math.min(...candles.map(c => c.low));
                const pivotP = (high + low + last.close) / 3;
                const r1 = (2 * pivotP) - low;
                const s1 = (2 * pivotP) - high;
                const r2 = pivotP + (high - low);
                const s2 = pivotP - (high - low);

                const entry = last.close;
                const sl = signal === 'LONG' ? Math.min(s1, entry * 0.995) : signal === 'SHORT' ? Math.max(r1, entry * 1.005) : entry * 0.99;
                const tp = signal === 'LONG' ? Math.max(r1, entry * 1.005) : signal === 'SHORT' ? Math.min(s1, entry * 0.995) : entry * 1.01;

                const priceRiskPerBTC = Math.abs(entry - sl);
                const riskAmountUSD = portfolioCapital * (riskPercent / 100);

                const riskSizedBTC = priceRiskPerBTC > 0 ? (riskAmountUSD / priceRiskPerBTC) : 0;
                const marginAndFeeRate = (1 / Math.max(1, leverage)) + (Math.max(0, takerFeeRate) / 100 * 2);
                const capitalAfterReserve = Math.max(0, portfolioCapital - (riskAmountUSD * 0.2));
                const maxNotionalByCapital = marginAndFeeRate > 0 ? capitalAfterReserve / marginAndFeeRate : 0;
                const btcPositionSize = entry > 0 ? Math.min(riskSizedBTC, maxNotionalByCapital / entry) : 0;
                const positionNotional = btcPositionSize * entry;
                const initialMargin = leverage > 0 ? positionNotional / leverage : positionNotional;

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div className="p-3 bg-cyber-bg/50 rounded-xl border border-cyber-border space-y-1">
                                        <label className="text-[11px] text-slate-400 font-mono block">{t.capital}</label>
                                        <input
                                            type="number"
                                            value={portfolioCapital}
                                            onChange={e => setPortfolioCapital(Math.max(1, Number(e.target.value)))}
                                            className="w-full bg-cyber-bg border border-cyber-border rounded px-3 py-1.5 font-mono text-cyber-cyan focus:outline-none focus:border-cyber-cyan"
                                        />
                                    </div>
                                    <div className="p-3 bg-cyber-bg/50 rounded-xl border border-cyber-border space-y-1">
                                        <label className="text-[11px] text-slate-400 font-mono block">{t.riskPercent}</label>
                                        <input
                                            type="number"
                                            step="0.1"
                                            value={riskPercent}
                                            onChange={e => setRiskPercent(Math.max(0.1, Number(e.target.value)))}
                                            className="w-full bg-cyber-bg border border-cyber-border rounded px-3 py-1.5 font-mono text-cyber-cyan focus:outline-none focus:border-cyber-cyan"
                                        />
                                    </div>
                                    <div className="p-3 bg-cyber-bg/50 rounded-xl border border-cyber-border space-y-1">
                                        <label className="text-[11px] text-slate-400 font-mono block">{t.takerFee}</label>
                                        <input
                                            type="number"
                                            step="0.01"
                                            value={takerFeeRate}
                                            onChange={e => setTakerFeeRate(Math.max(0, Number(e.target.value)))}
                                            className="w-full bg-cyber-bg border border-cyber-border rounded px-3 py-1.5 font-mono text-cyber-cyan focus:outline-none focus:border-cyber-cyan"
                                        />
                                    </div>
                                </div>

                                {analysis && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                        <div className="p-4 bg-cyber-bg/60 rounded-xl border border-cyber-border">
                                            <div className="text-[11px] text-slate-400 font-mono">{t.positionNotional}</div>
                                            <div className="text-xl font-mono font-bold text-slate-100 mt-1">
                                                ${analysis.strat2.positionNotional.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                            </div>
                                            <div className="text-xs font-mono text-cyber-cyan mt-1">~ {analysis.strat2.btcPositionSize.toFixed(4)} BTC</div>
                                        </div>

                                        <div className="p-4 bg-cyber-bg/60 rounded-xl border border-cyber-border">
                                            <div className="text-[11px] text-slate-400 font-mono">{t.initialMargin}</div>
                                            <div className="text-xl font-mono font-bold text-cyber-cyan mt-1">
                                                ${analysis.strat2.initialMargin.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                            </div>
                                            <div className="text-xs font-mono text-slate-400 mt-1">Notional ÷ {leverage}x</div>
                                        </div>

                                        <div className="p-4 bg-cyber-bg/60 rounded-xl border border-cyber-border">
                                            <div className="text-[11px] text-slate-400 font-mono">{t.estFees}</div>
                                            <div className="text-xl font-mono font-bold text-cyber-yellow mt-1">
                                                ${analysis.strat2.roundTripFees.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                            </div>
                                            <div className="text-xs font-mono text-slate-400 mt-1">Round-trip @ {takerFeeRate}%</div>
                                        </div>

                                        <div className="p-4 bg-cyber-bg/60 rounded-xl border border-cyber-border">
                                            <div className="text-[11px] text-slate-400 font-mono">{t.reqBuffer}</div>
                                            <div className="text-xl font-mono font-bold text-cyber-green mt-1">
                                                ${analysis.strat2.recommendedReserve.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                            </div>
                                            <div className="text-xs font-mono text-slate-400 mt-1">Margin + Fees + Volatility</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'layers' && (
                            <div className="hud-panel rounded-2xl p-6 space-y-6">
                                <div className="flex justify-between items-center border-b border-cyber-border pb-4">
                                    <h2 className="text-lg font-bold font-mono text-cyber-cyan flex items-center gap-2">
                                        <Icons.Layers className="w-5 h-5" />
                                        {t.indicatorLegend}
                                    </h2>
                                    <div className="text-xs font-mono text-slate-400">
                                        ACTIVE GLOW: <span className="text-cyber-cyan font-bold uppercase">{glowLevel}</span>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {Object.entries(layerSettings).map(([key, setting]) => (
                                        <div key={key} className="p-3 border border-cyber-border rounded-xl bg-cyber-bg/50 flex items-center justify-between">
                                            <div className="flex items-center space-x-3">
                                                <input
                                                    type="checkbox"
                                                    checked={setting.visible}
                                                    onChange={e => {
                                                        const val = e.target.checked;
                                                        setLayerSettings(prev => ({
                                                            ...prev,
                                                            [key]: { ...prev[key], visible: val }
                                                        }));
                                                    }}
                                                    className="w-4 h-4 rounded border-cyber-border bg-cyber-bg text-cyber-cyan focus:ring-0 accent-cyber-cyan cursor-pointer"
                                                />
                                                <span className="text-xs font-mono font-semibold text-slate-200">{setting.name}</span>
                                            </div>
                                            <input
                                                type="color"
                                                value={setting.color.startsWith('#') ? setting.color : '#00E5FF'}
                                                onChange={e => {
                                                    const newColor = e.target.value;
                                                    setLayerSettings(prev => ({
                                                        ...prev,
                                                        [key]: { ...prev[key], color: newColor }
                                                    }));
                                                }}
                                                className="w-6 h-6 rounded cursor-pointer border-0 bg-transparent"
                                            />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="max-w-7xl mx-auto px-4 pb-8 pt-4 text-[11px] leading-relaxed text-slate-500">
                        <div className="hud-panel rounded-xl p-3 border border-cyber-yellow/20">
                            <strong className="text-cyber-yellow">{tx('คำเตือนความเสี่ยง:', 'RISK DISCLAIMER:')}</strong> {tx('ข้อมูลและสัญญาณเป็นข้อมูลเพื่อการศึกษา ไม่ใช่คำแนะนำการลงทุนหรือการรับประกันผลกำไร ราคาจาก REST API อาจล่าช้า ค่าความเสี่ยง/มาร์จินเป็นค่าประมาณ ไม่ใช่ราคา Liquidation จริง และระบบนี้ไม่ส่งคำสั่งซื้อขาย', 'Data and signals are for research only, not investment advice or profit guarantees. REST data may be delayed; margin/risk figures are estimates, not actual liquidation prices. This app does not place orders.')}
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
